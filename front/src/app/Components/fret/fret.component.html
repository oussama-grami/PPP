<div class="container-fluid full-height">
  <div class="row row-height">
    <!-- Left Info Panel -->
    <div class="col-lg-6 content-left">
      <div class="content-left-wrapper">
        <img src="assets/img/FRET.png" class="img-title" id="descriptionImage" alt="Freight Icon"/>
        <h2 id="descriptionTitle">Freight</h2>
        <p id="descriptionText">
          Evaluate your air and sea freight emissions in just a few clicks!
        </p>
      </div>
    </div>

    <!-- Right Form Panel -->
    <div class="col-lg-6 content-right" id="start">
      <div id="wizard_container">
        <!-- Page Number Indicator -->
        <div class="page-indicator">
          <span class="current-page">5</span>/<span class="total-pages">7</span>
        </div>

        <form [formGroup]="fForm" (ngSubmit)="onNext()" id="wrapped">
          <!-- Error Message Display -->
          <div *ngIf="errorMessage" class="alert alert-danger">
            {{ errorMessage }}
          </div>

          <div class="step card">
            <h3 class="main_question">Freight Transportation Form</h3>

            <!-- Aerial Freight Long -->
            <div class="form-group">
              <label for="freightAirLong" class="form-label">Aerial Freight (Long-haul)</label>
              <input type="number" class="form-control" formControlName="freightAirLong"
                     id="freightAirLong" placeholder="Enter aerial long-haul freight volume">
              <small class="text-danger" *ngIf="fForm.get('freightAirLong')?.touched && fForm.get('freightAirLong')?.invalid">
                Aerial Freight (Long-haul) is required.
              </small>
            </div>

            <!-- Aerial Freight Short -->
            <div class="form-group">
              <label for="freightAirShort" class="form-label">Aerial Freight (Short-haul)</label>
              <input type="number" class="form-control" formControlName="freightAirShort"
                     id="freightAirShort" placeholder="Enter aerial short-haul freight volume">
              <small class="text-danger" *ngIf="fForm.get('freightAirShort')?.touched && fForm.get('freightAirShort')?.invalid">
                Aerial Freight (Short-haul) is required.
              </small>
            </div>

            <!-- Maritime Freight Long -->
            <div class="form-group">
              <label for="freightSeaLong" class="form-label">Maritime Freight (Long-haul)</label>
              <input type="number" class="form-control" formControlName="freightSeaLong"
                     id="freightSeaLong" placeholder="Enter maritime long-haul freight volume">
              <small class="text-danger" *ngIf="fForm.get('freightSeaLong')?.touched && fForm.get('freightSeaLong')?.invalid">
                Maritime Freight (Long-haul) is required.
              </small>
            </div>

            <!-- Maritime Freight Short -->
            <div class="form-group">
              <label for="freightSeaShort" class="form-label">Maritime Freight (Short-haul)</label>
              <input type="number" class="form-control" formControlName="freightSeaShort"
                     id="freightSeaShort" placeholder="Enter maritime short-haul freight volume">
              <small class="text-danger" *ngIf="fForm.get('freightSeaShort')?.touched && fForm.get('freightSeaShort')?.invalid">
                Maritime Freight (Short-haul) is required.
              </small>
            </div>
          </div>

          <!-- Navigation Buttons -->
          <div class="button-group">
            <button type="button" name="backward" class="btnbackward" [routerLink]="'/' + RoutesEnum.AERIENS">Back</button>
            <button type="submit" name="forward" class="btnforward">Continue</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
