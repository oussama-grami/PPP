<div class="container-fluid">
  <div class="row justify-content-center">
    <!-- Left Section: Total Emissions -->
    <div
      class="col-lg-8 col-md-10 d-flex flex-column align-items-center position-relative event-container"
    >
      <div class="header">
        <span class="header-bold">Event’s Total Carbon Footprint</span>
      </div>

      <div class="total-emissions card">
        <div class="total-header">Total Event Emissions:</div>
        <div class="total-value">
          <span class="result-text"
            >{{ totalCarbonFootprint.toFixed(2) }} tCO2</span
          >
        </div>
      </div>
    </div>

    <!-- Title for Recommendations Section -->
    <div class="col-lg-8 col-md-10 text-center my-4 mt-5">
      <h2 class="see-recommendations-title">Recommendations</h2>
    </div>

    <!-- Right Section: Recommendations List -->
    <div class="col-lg-8 col-md-10">
      <app-instruction-list></app-instruction-list>
    </div>
  </div>
</div>
