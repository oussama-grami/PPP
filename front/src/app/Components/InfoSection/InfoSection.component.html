<div class="container" >
  <div class="row">
    <div class="col-6">
      <div class="title">
        {{title}}
      </div>

      <div *ngFor="let paragraph of paragraphs" class="description" >
        {{paragraph}}
      </div>
     
      <button class="paginationButton" style="background-color: #014131;" (click)="navigateToLink()">
      <span
          class="paginationButtonText">{{buttonText}}</span><svg
          xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M4.5 12H19.5M19.5 12L13.875 6M19.5 12L13.875 18" stroke="white" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round" />
        </svg></button>
    </div>
    <div class="col-6 image">
      <img src="{{image}}" alt="{{imageAlt}}"  class="img" >
    </div>
  </div>
</div>
