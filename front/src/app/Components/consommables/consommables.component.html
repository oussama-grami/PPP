<div class="container-fluid full-height"style="margin-top: 50px;">
  <div class="row row-height">
    <div class="col-lg-6 content-left1">
      <div class="content-left-wrapper">
        <img src="assets/img/Consommable.png" class="img-title" id="descriptionImage"/>
        <h2 id="descriptionTitle">Office Supplies</h2>
        <p id="descriptionText">Evaluate the emissions of your expenses on office supplies. </p>
      </div>
    </div>
    <div class="col-lg-6 content-right" id="start"style="overflow-y: hidden;">
      <div id="wizard_container">
        <form [formGroup]="consForm" (ngSubmit)="onNext()" id="wrapped">
          <div class="step">
            <h3 class="main_question mt-2"><strong>5/7</strong> Enter the data related to your company's consumables</h3>

            <!-- Error Message Display -->
            <div *ngIf="errorMessage" class="alert alert-danger">
              {{ errorMessage }}
            </div>

            <!-- Montant Papier with Unit -->
            <div class="form-group row">
              <div class="col-9">
                <label for="montantPapier">Montant Papier</label>
                <input type="number" class="form-control" id="montantPapier" formControlName="montantPapier" placeholder="Montant Papier">
                <small class="text-danger" *ngIf="consForm.controls['montantPapier'].touched && consForm.controls['montantPapier'].invalid">
                  Montant Papier is required.
                </small>
              </div>
              <div class="col-3">
                <label for="unitePapier">Unite</label>
                <select class="form-control" id="unitePapier" formControlName="unitePapier">
                  <option [value]="Unite.Dolar">Dollar</option>
                  <option [value]="Unite.Euro">Euro</option>
                  <option [value]="Unite.DT">DT</option>
                </select>
                <small class="text-danger" *ngIf="consForm.controls['unitePapier'].touched && consForm.controls['unitePapier'].invalid">
                  Unite Papier is required.
                </small>
              </div>
            </div>

            <!-- Montant Fournitures with Unit -->
            <div class="form-group row">
              <div class="col-9">
                <label for="montantFournitures">Montant Fournitures</label>
                <input type="number" class="form-control" id="montantFournitures" formControlName="montantFournitures" placeholder="Montant Fournitures">
                <small class="text-danger" *ngIf="consForm.controls['montantFournitures'].touched && consForm.controls['montantFournitures'].invalid">
                  Montant Fournitures is required.
                </small>
              </div>
              <div class="col-3">
                <label for="uniteFourniture">Unite</label>
                <select class="form-control" id="uniteFourniture" formControlName="uniteFourniture">
                  <option [value]="Unite.Dolar">Dollar</option>
                  <option [value]="Unite.Euro">Euro</option>
                  <option [value]="Unite.DT">DT</option>
                </select>
                <small class="text-danger" *ngIf="consForm.controls['uniteFourniture'].touched && consForm.controls['uniteFourniture'].invalid">
                  Unite Fourniture is required.
                </small>
              </div>
            </div>
          </div>

          <!-- Buttons Section -->
          <div id="bottom-wizard2 mb-2 pb-2">
              <button type="button" name="backward" class="backward" routerLink="/fret">Back</button>
              <button type="submit" name="forward" class="forward">Continue</button>
          </div>

        </form>

      </div>
    </div>
  </div>
</div>
