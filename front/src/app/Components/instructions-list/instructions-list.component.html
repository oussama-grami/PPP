<div class="instruction-container mt-4">
  <div class="card border-0" [ngClass]="{ 'shadow-lg': true }">
    <div class="card-header d-flex align-items-center">
      <i class="fas fa-clipboard-list fa-lg me-3"></i>
      <h3 class="mb-0">{{ title }}</h3>
    </div>
    <div class="card-body">
      <ul
        class="list-group list-group-flush"
        [@listAnimation]="instructions.length"
      >
        <li
          *ngFor="let instruction of instructions; let i = index"
          @listItemAnimation
          class="list-group-item"
        >
          <div class="list-icon">{{ i + 1 }}</div>
          <div class="content-wrapper">
            <div class="fw-bold">Étape {{ i + 1 }}</div>
            <div class="step-content">{{ instruction }}</div>
          </div>
          <i class="fas fa-chevron-right"></i>
        </li>
      </ul>
      <div *ngIf="instructions.length === 0" class="text-center py-4">
        <i
          class="fas fa-info-circle text-muted mb-3"
          style="font-size: 2rem"
        ></i>
        <p class="mb-0">Aucune instruction disponible.</p>
      </div>
    </div>
  </div>
</div>
