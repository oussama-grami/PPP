<div class="instruction-container">
  <div class="card border-0 shadow-lg">
    <div class="card-header bg-primary text-white d-flex align-items-center">
      <i class="fas fa-list-alt fa-lg me-3"></i>
      <h3 class="mb-0">{{ title }}</h3>
    </div>
    <div class="card-body">
      <!-- Show loading spinner -->
      <div *ngIf="loading" class="text-center py-4">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-2">Loading recommendations...</p>
      </div>

      <!-- Show error message if any -->
      <div *ngIf="error" class="alert alert-danger" role="alert">
        {{ error }}
      </div>

      <!-- Show recommendations if available -->
      <div
        *ngIf="recommendations && recommendations.length > 0"
        [@listAnimation]="recommendations.length"
      >
        <div
          *ngFor="let recommendation of recommendations; let i = index"
          @listItemAnimation
          class="recommendation-item mb-3 p-3 border-bottom"
        >
          <h5 class="recommendation-param">{{ recommendation.parameter }}</h5>
          <div class="row">
            <div class="col-md-6">
              <div class="objective-container">
                <div class="label text-muted mb-1">
                  <i class="fas fa-bullseye me-2"></i> Issue
                </div>
                <p class="objective">{{ recommendation.objective }}</p>
              </div>
            </div>
            <div class="col-md-6">
              <div class="advice-container">
                <div class="label text-muted mb-1">
                  <i class="fas fa-lightbulb me-2"></i> Recommendation
                </div>
                <p class="advice">{{ recommendation.advice }}</p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Show regular instructions if recommendations aren't requested or available -->
      <ol
        *ngIf="instructions.length > 0"
        class="list-group list-group-numbered list-group-flush"
        [@listAnimation]="instructions.length"
      >
        <li
          *ngFor="let instruction of instructions; let i = index"
          @listItemAnimation
          class="list-group-item d-flex align-items-start"
        >
          <div class="ms-2 me-auto">
            <div class="fw-bold">Étape {{ i + 1 }}</div>
            {{ instruction }}
          </div>
          <i class="fas fa-chevron-right text-muted ms-3"></i>
        </li>
      </ol>

      <!-- Show empty state message if both recommendations and instructions are empty -->
      <div
        *ngIf="!loading && !recommendations.length && !instructions.length"
        class="text-center py-4 text-muted"
      >
        <i class="fas fa-info-circle fa-2x mb-2"></i>
        <p>No instructions or recommendations available.</p>
      </div>
    </div>
  </div>
</div>
