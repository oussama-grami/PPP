<div class="container" >
  <div class="row">
    <div class="retour"> <button [routerLink]="'/' + routesEnum.ESG + '/15'">
        <div><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M19.5 12H4.5M4.5 12L10.125 6M4.5 12L10.125 18" stroke="black" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round" />
          </svg></div>
          <div class="retour-text" onclick="history.back()">
            Back
        </div>
      </button>
    </div>
  </div>
  <div class="row title ">
    Your company’s ESG Performance is
  </div>
  <div class="row">
    <div class="box-border " style="margin-right: 20px; width: 777px; padding-left: 0px;">
         <div class="result-header" style="margin-bottom: 0px; margin-left: 24px;">Position Map
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path fill-rule="evenodd" clip-rule="evenodd"
            d="M8.99988 16.5C13.142 16.5 16.4999 13.1421 16.4999 9C16.4999 4.85786 13.142 1.5 8.99988 1.5C4.85774 1.5 1.49988 4.85786 1.49988 9C1.49988 13.1421 4.85774 16.5 8.99988 16.5Z"
            stroke="#D0D1D2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M9 6V9" stroke="#D0D1D2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="8.99988" cy="12" r="0.75" fill="#D0D1D2" />
        </svg>
      </div>
      <div style="display: flex; ">
        <app-esgdiagram style="width: 772px; height: 772px;"></app-esgdiagram>
        <div class="diagram-legend legend-1">Environnement</div>
        <div class="diagram-legend legend-2">Gouvernance</div>
        <div class="diagram-legend legend-3">Social</div>
      </div>

    </div>
    <!-- deleted from here esg-->
    <div class="box-border " style="width: 523px;">
        <app-esg-overview></app-esg-overview>
    </div>
    <div *ngIf="disableTakeActionButton()" class="action-box" style=" display: grid; place-items: center;">
      <div class="action-box-header">
        Take actions to improve your ESG performance
      </div>
      <button class="pagginationButton" style="background-color: #014131; margin-top: 0px;" [routerLink]="'/' + routesEnum.ROADMAP"> <span
          style="margin-right: 8px; color:#FFF;" class="pagginationButtonText">Take actions</span><svg
          xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M4.5 12H19.5M19.5 12L13.875 6M19.5 12L13.875 18" stroke="white" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round" />
        </svg></button>
    </div>
  </div>
</div>
