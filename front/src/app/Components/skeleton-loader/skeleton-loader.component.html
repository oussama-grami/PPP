<ng-container [ngSwitch]="type">
  <!-- Paragraph type with multiple lines -->
  <ng-container *ngSwitchCase="'paragraph'">
    <div 
      *ngFor="let item of getItems()" 
      class="skeleton-loader"
      [style.width]="item === getItems().length - 1 ? '80%' : dimensions.width"
      [style.height]="'1rem'"
      [style.margin-bottom]="'0.7rem'">
    </div>
  </ng-container>
  
  <!-- Card layout with image placeholder and text -->
  <ng-container *ngSwitchCase="'card'">
    <div class="skeleton-card">
      <div class="skeleton-loader" [style.height]="'160px'"></div>
      <div class="skeleton-card-body">
        <div class="skeleton-loader" [style.width]="'70%'" [style.height]="'1.5rem'" [style.margin-bottom]="'0.7rem'"></div>
        <div class="skeleton-loader" [style.width]="'90%'" [style.height]="'1rem'" [style.margin-bottom]="'0.5rem'"></div>
        <div class="skeleton-loader" [style.width]="'60%'" [style.height]="'1rem'"></div>
      </div>
    </div>
  </ng-container>
  
  <!-- Image placeholder -->
  <ng-container *ngSwitchCase="'image'">
    <div 
      class="skeleton-loader skeleton-image" 
      [style.width]="dimensions.width"
      [style.height]="dimensions.height"
      [style.margin]="dimensions.margin">
    </div>
  </ng-container>
  
  <!-- Avatar/circle placeholder -->
  <ng-container *ngSwitchCase="'avatar'">
    <div 
      class="skeleton-loader skeleton-avatar" 
      [style.width]="dimensions.width"
      [style.height]="dimensions.height"
      [style.margin]="dimensions.margin">
    </div>
  </ng-container>
  
  <!-- Default text line placeholder -->
  <ng-container *ngSwitchDefault>
    <div 
      class="skeleton-loader" 
      [style.width]="dimensions.width"
      [style.height]="dimensions.height"
      [style.margin]="dimensions.margin">
    </div>
  </ng-container>
</ng-container>
