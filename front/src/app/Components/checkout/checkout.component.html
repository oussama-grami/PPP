<app-nav-acceuil [selected]="5"></app-nav-acceuil>
<div class="container">
  <div class="retour">
    <button style="display: flex; align-items: center;" [routerLink]="'/details'">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M19.5 12H4.5M4.5 12L10.125 6M4.5 12L10.125 18" stroke="black" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <div class="retour-text">Back</div>
    </button>
  </div>
  <div class="nav default-font">
    <span>Cart</span>
    <span>
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M9 18L15 12L9 6" stroke="black" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </span>
    <span class="grey-color">General informations</span>
    <span>
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M9 18L15 12L9 6" stroke="#999999" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </span>
    <span class="grey-color">Payment</span>
  </div>

  <div class="row checkout-table">
    <div class="col-12 col-md-6 header-text">Project name</div>
    <div class="col-6 col-md-3 header-text">Tons/CO2</div>
    <div class="col-6 col-md-3 header-text">Price</div>
  </div>
  <div class="separator" style="margin-top: 14px;"></div>
  <div *ngFor="let item of cartItems; let i = index" class="row align-items-center mb-3">
    <div class="col-10 col-md-6">
      <div class="row align-items-center justify-content-between">
        <div class="col-4 col-md-2">
          <div class="modal-photo">
            <img [src]="item.url" alt="">
          </div>
        </div>
        <div class="col-7 col-md-9 mt-3 mt-md-0">
          <div class="project-name">{{ item.name }}</div>
          <div class="project-name-details">
            {{ (+item.cost * +item.quantity) | number:'1.2-2' }}$
          </div>

        </div>
      </div>
    </div>
    <div class="col-6 col-md-3 mt-3 mt-md-0">
      <div class="d-flex justify-content-center">
        <span class="project-price">
          <span (click)="decreaseQuantity(i)" class="pointer">
            <svg xmlns="http://www.w3.org/2000/svg" width="12" height="2" viewBox="0 0 12 2" fill="none">
              <path d="M11.5 2H0.5V0H11.5V2Z" fill="#014131" />
            </svg>
          </span>
          <span class="project-price-text">{{ item.quantity }} tCO2e</span>
          <span (click)="increaseQuantity(i)" class="pointer">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="12" viewBox="0 0 13 12" fill="none">
              <path d="M12.5 6.85714H7.35714V12H5.64286V6.85714H0.5V5.14286H5.64286V0H7.35714V5.14286H12.5V6.85714Z" fill="#014131" />
            </svg>
          </span>
        </span>
      </div>
    </div>
    <div class="col-6 col-md-3 mt-3 mt-md-0">
      <div class="d-flex justify-content-between align-items-center">
        <span class="header-text"> ${{ item.quantity * +item.cost }}</span>
        <span (click)="removeItem(i)" class="pointer">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M6.28564 8.57141L7.2484 18.199C7.35064 19.2214 8.21097 20 9.23848 20H14.7614C15.7889 20 16.6492 19.2214 16.7515 18.199L17.7142 8.57141" stroke="black" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M13.5 15.5V10.5" stroke="black" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M10.5 15.5V10.5" stroke="black" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M4.57129 6.28571H9.14272M9.14272 6.28571L9.52478 4.75746C9.63607 4.3123 10.0361 4 10.4949 4H13.5048C13.9637 4 14.3636 4.3123 14.4749 4.75746L14.857 6.28571M9.14272 6.28571H14.857M14.857 6.28571H19.4284" stroke="black" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </div>
    </div>
  </div>
  <div class="separator" style="margin-top: 14px;"></div>
  <div class="total d-flex justify-content-between align-items-center">
    <span class="project-name bigger-font">Total</span>
    <span class="header-text bigger-font" style="float: right;">{{ getTotalPrice() | number:'1.2-2' }}$</span>
  </div>
  <div class="separator"></div>
  <div class="checkoutButtons d-flex justify-content-center align-items-center flex-column flex-md-row w-100 justify-content-md-between">
    <button [routerLink]="'/details'" class="checkoutButton1 w-auto"><span class="checkoutButton1Text">Back</span></button>
    <button [routerLink]="'/payment'" class="checkoutButton2 w-auto"><span class="checkoutButton2Text">Checkout</span></button>
  </div>
</div>
