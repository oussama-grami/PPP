<app-nav-acceuil [selected]="1"></app-nav-acceuil>
<div class="container-fluid full-height" style="margin-top: 50px;">
  <div class="row row-height">
    <div class="col-lg-6 content-left1">
      <div class="content-left-wrapper">
        <img src="assets/img/aerienne.png" class="img-title" id="descriptionImage"/>
        <h2 id="descriptionTitle">Business air travel </h2>
        <p id="descriptionText">Evaluate your employees' business air travel emissions.</p>
      </div>
    </div>
    <div class="col-lg-6 content-right" id="start" style="overflow-y: hidden;">
      <div id="wizard_container">
        <form [formGroup]="depForm" (ngSubmit)="onNext()" id="wrapped">
          <div class="step">
            <h3 class="main_question mt-2"><strong>4/7</strong> Enter the data related to your company's business air
              travel</h3>
            <!-- Error Message Display -->
            <div *ngIf="errorMessage" class="alert alert-danger">
              {{ errorMessage }}
            </div>

            <!-- Short-haul Trips -->
            <div class="form-group">
              <input type="number" class="form-control" formControlName="nbrArretRetourC"
                     placeholder="Number of short-haul round trips (- 3000 Km)">
              <small class="text-danger" *ngIf="nbrArretRetourC?.touched && nbrArretRetourC?.invalid">
                Short-haul trips are required.
              </small>
            </div>

            <!-- Medium-haul Trips -->
            <div class="form-group">
              <input type="number" class="form-control" formControlName="nbrArretRetourM"
                     placeholder="Number of medium-haul round trips (3,000 Km to 6,000 Km)">
              <small class="text-danger" *ngIf="nbrArretRetourM?.touched && nbrArretRetourM?.invalid">
                Medium-haul trips are required.
              </small>
            </div>

            <!-- Long-haul Trips -->
            <div class="form-group">
              <input type="number" class="form-control" formControlName="nbrArretRetourL"
                     placeholder="Number of long-haul round trips (+ 6000 Km)">
              <small class="text-danger" *ngIf="nbrArretRetourL?.touched && nbrArretRetourL?.invalid">
                Long-haul trips are required.
              </small>
            </div>
          </div>

          <!-- Buttons Section -->
          <div id="bottom-wizard2 mb-2 pb-2">
              <button type="button" name="backward" class="backward" routerLink="/car">Back</button>
              <button type="submit" name="forward" class="forward">Continue</button>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>
