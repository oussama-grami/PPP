<div class="container-fluid full-height">
  <div class="row row-height">
    <!-- Left Info Panel -->
    <div class="col-lg-6 content-left">
      <div class="content-left-wrapper">
        <div class="progress-container">
          <app-progress-bar [currentStep]="4" [totalSteps]="7"></app-progress-bar>
        </div>
        <h2 id="descriptionTitle">Business Air Travel</h2>
        <p id="descriptionText">
          Evaluate your employees' business air travel emissions.
        </p>
      </div>
    </div>

    <!-- Right Form Panel -->
    <div class="col-lg-6 content-right">
      <div id="wizard_container">
        <form [formGroup]="depForm" (ngSubmit)="onNext()" id="wrapped">
          <!-- Error Message Display -->
          <div *ngIf="errorMessage" class="alert alert-danger">
            <i class="fas fa-exclamation-triangle"></i>
            {{ errorMessage }}
          </div>

          <div class="step">
            <h3 class="main_question">
              <i class="fas fa-plane"></i>
              Business Air Travel Form
            </h3>

            <!-- Short-haul Trips -->
            <div class="form-group">
              <label for="numberOfShortHaulRoundTrips" class="form-label">Short-haul Round Trips (- 3000 Km)</label>
              <input type="number" class="form-control" formControlName="numberOfShortHaulRoundTrips"
                     id="numberOfShortHaulRoundTrips" placeholder="Enter number of short-haul trips">
              <small class="text-danger" *ngIf="numberOfShortHaulRoundTrips?.touched && numberOfShortHaulRoundTrips?.invalid">
                Short-haul trips are required.
              </small>
            </div>

            <!-- Medium-haul Trips -->
            <div class="form-group">
              <label for="numberOfMediumHaulRoundTrips" class="form-label">Medium-haul Round Trips (3,000 - 6,000 Km)</label>
              <input type="number" class="form-control" formControlName="numberOfMediumHaulRoundTrips"
                     id="numberOfMediumHaulRoundTrips" placeholder="Enter number of medium-haul trips">
              <small class="text-danger" *ngIf="numberOfMediumHaulRoundTrips?.touched && numberOfMediumHaulRoundTrips?.invalid">
                Medium-haul trips are required.
              </small>
            </div>

            <!-- Long-haul Trips -->
            <div class="form-group">
              <label for="numberOfLongHaulRoundTrips" class="form-label">Long-haul Round Trips (+ 6000 Km)</label>
              <input type="number" class="form-control" formControlName="numberOfLongHaulRoundTrips"
                     id="numberOfLongHaulRoundTrips" placeholder="Enter number of long-haul trips">
              <small class="text-danger" *ngIf="numberOfLongHaulRoundTrips?.touched && numberOfLongHaulRoundTrips?.invalid">
                Long-haul trips are required.
              </small>
            </div>
          </div>

          <!-- Navigation Buttons -->
          <div class="button-group">
            <button type="button" name="backward" class="btn-backward" [routerLink]="'/' + RoutesEnum.CARBURANT">
              <i class="fas fa-arrow-left"></i>
              Back
            </button>
            <button type="submit" name="forward" class="btn-forward">
              Continue
              <i class="fas fa-arrow-right"></i>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
