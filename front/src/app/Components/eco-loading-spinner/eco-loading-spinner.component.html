<div class="eco-loading-container">
  <div class="eco-spinner">
    <svg class="eco-spinner-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Circular track -->
  <circle class="eco-track" cx="50" cy="50" r="45" fill="none" stroke-width="4"></circle>
  <!-- Animated progress -->
  <circle class="eco-progress" cx="50" cy="50" r="45" fill="none" stroke-width="4" stroke-linecap="round"></circle>
  
  <!-- Modern leaf icon in the center -->
  <g class="eco-icon">
    <!-- External SVG image properly referenced -->
    <image 
      href="assets/img/leaf.jpg"
      x="30" 
      y="37" 
      width="40" 
      height="40" 
      class="eco-leaf-icon"
      preserveAspectRatio="xMidYMid meet"
    />
    <!-- Optional decorative veins -->
    
  </g>
</svg>
  </div>
  <p class="eco-loading-text">{{ loadingText }}</p>
</div>
