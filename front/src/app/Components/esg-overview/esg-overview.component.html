
  <div class="esg-container">
    <div class="header">
      <h2>ESG Overview</h2>
      <svg class="info-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path fill-rule="evenodd" clip-rule="evenodd"
          d="M8.99988 16.5C13.142 16.5 16.4999 13.1421 16.4999 9C16.4999 4.85786 13.142 1.5 8.99988 1.5C4.85774 1.5 1.49988 4.85786 1.49988 9C1.49988 13.1421 4.85774 16.5 8.99988 16.5Z"
          stroke="#D0D1D2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M9 6V9" stroke="#D0D1D2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="8.99988" cy="12" r="0.75" fill="#D0D1D2" />
      </svg>
    </div>
  
    <div *ngFor="let category of categories" class="category-section">
      <h3 class="category-title" [style.color]="category.color">{{category.name}}</h3>
      
      <div class="level-titles">
        <div *ngFor="let level of category.levels" 
             class="level-title"
             [class.active]="isInScoreRange(category.score, level.range[0], level.range[1])"
             [style.color]="isInScoreRange(category.score, level.range[0], level.range[1]) ? level.color : '#777777'">
          {{level.title}}
        </div>
      </div>
  
      <div class="slider-container">
        <div class="slider-track">
          <div *ngFor="let level of category.levels" 
               class="slider-segment" 
               [style.background-color]="level.color"
               [style.width.%]="(level.range[1] - level.range[0] + 1)/40*100">
          </div>
        </div>
        <div class="slider-indicator" 
             [style.left]="getSliderPosition(category.score)"
             [style.border-color]="getActiveLevel(category)?.color">
        </div>
      </div>
  
      <div class="description-box">
        <p>{{getActiveLevel(category)?.description}}</p>
      </div>
    </div>
  </div>
