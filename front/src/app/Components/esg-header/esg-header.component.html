<div class="progress-header">
  <!-- Environment Section -->
  <div class="section-box environment" [class.active]="true">
    <div class="section-icon">
      <img src="assets/img/leaf1.png" alt="Environment icon">
    </div>
    <span class="section-label">Environment</span>
  </div>
  
  <!-- Environment Questions (1-5) -->
  <div *ngFor="let num of getRange(1, 5)" class="question-box" 
       [class.completed]="num < currentQuestion"
       [class.current]="num === currentQuestion">
    <span class="question-number">{{ num }}</span>
    <div class="progress-indicator"></div>
  </div>
  
  <!-- Social Section -->
  <div class="section-box social" [class.active]="currentQuestion > 5">
    <div class="section-icon">
      <img src="assets/img/leaf2.png" alt="Social icon">
    </div>
    <span class="section-label">Social</span>
  </div>
  
  <!-- Social Questions (6-10) -->
  <div *ngFor="let num of getRange(6, 10)" class="question-box" 
       [class.completed]="num < currentQuestion"
       [class.current]="num === currentQuestion">
    <span class="question-number">{{ num }}</span>
    <div class="progress-indicator"></div>
  </div>
  
  <!-- Governance Section -->
  <div class="section-box governance" [class.active]="currentQuestion > 10">
    <div class="section-icon">
      <img src="assets/img/leaf3.png" alt="Governance icon">
    </div>
    <span class="section-label">Governance</span>
  </div>
  
  <!-- Governance Questions (11-15) -->
  <div *ngFor="let num of getRange(11, 15)" class="question-box" 
       [class.completed]="num < currentQuestion"
       [class.current]="num === currentQuestion">
    <span class="question-number">{{ num }}</span>
    <div class="progress-indicator"></div>
  </div>
  
  <!-- Results Section -->
  <div class="section-box results" [class.active]="currentQuestion > 15">
    <div class="section-icon">
      <img src="assets/img/leaf4.png" alt="Results icon">
    </div>
    <span class="section-label">Results</span>
  </div>
</div>
