<div class="container">
  <!-- Environment Section -->
  <div class="box green">
    <img src="assets/img/leaf1.png" alt="Environment icon">
    <h2 class="env">Environment</h2>
  </div>
  <!-- Environment Questions (1-5) -->
  <div *ngFor="let num of getRange(1, 5)" class="box">
    <p class="number">{{ num }}</p>
    <div class="bar"
         [class.active]="num === currentQuestion">
    </div>
  </div>
  <!-- Social Section -->
  <div class="box grey" [class.social]="currentQuestion > 5">
    <img src="assets/img/leaf2.png" alt="Social icon">
    <h2 class="env">Social</h2>
  </div>

  <!-- Social Questions (6-10) -->
  <div *ngFor="let num of getRange(6, 10)" class="box">
    <p class="number">{{ num }}</p>
    <div class="bar social"
         [class.active]="num === currentQuestion"></div>
  </div>

  <!-- Governance Section -->
  <div class="box grey" [class.governance]="currentQuestion > 10">
    <img src="assets/img/leaf3.png" alt="Governance icon">
    <h2 class="env">Governance</h2>
  </div>

  <!-- Governance Questions (11-15) -->
  <div *ngFor="let num of getRange(11, 15)" class="box">
    <p class="number">{{ num }}</p>
    <div class="bar social"
         [class.active]="num === currentQuestion"></div>
  </div>

  <!-- Results Section -->
  <div class="box grey">
    <img src="assets/img/leaf4.png" alt="Results icon">
    <h1 class="env">Results</h1>
  </div>
</div>
