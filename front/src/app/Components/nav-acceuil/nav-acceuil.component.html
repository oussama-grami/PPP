<nav class="navbar" [class.navbar-scrolled]="isScrolled">
  <div class="container">
    <!-- Brand logo -->
    <a class="navbar-brand" [routerLink]="'/'">
      <img src="assets/Ecopilot/ecopilot_logo.png" alt="EcoPilot Logo" />
    </a>

    <!-- Navigation content - enhanced for horizontal layout -->
    <div class="navbar-center">
      <div class="navbar-content" [ngClass]="{ active: mobileMenuOpen }">
        <ul class="navbar-nav">
          <!-- Home -->
          <li class="nav-item">
            <a
              class="nav-link"
              [routerLink]="'/'"
              [class.active]="router.url === '/'"
              (click)="mobileMenuOpen = false"
            >
              <i class="bi bi-house"></i> Home
            </a>
          </li>

          <!-- AI Tools Dropdown -->
          <li class="nav-item dropdown">
            <a
              class="nav-link"
              (click)="toggleDropdown('ai-tools', $event)"
              [class.active]="
                isRouteActivePartial([
                  routes.CARBONE,
                  routes.PREDICTION_INFO,
                  routes.EVENT_FOOTPRINT
                ])
              "
            >
              <i class="bi bi-cpu"></i> AI Tools
              <i
                class="bi bi-chevron-down"
                [ngClass]="{ 'bi-chevron-up': isDropdownActive('ai-tools') }"
              ></i>
            </a>
            <div
              class="dropdown-menu"
              [class.show]="isDropdownActive('ai-tools')"
            >
              <div class="mobile-dropdown-wrapper">
                <a
                  class="dropdown-item"
                  [routerLink]="'/' + routes.CARBONE"
                  (click)="mobileMenuOpen = false"
                >
                  <i class="bi bi-calculator"></i> Carbon Footprint Calculator
                </a>
                <a
                  class="dropdown-item"
                  [routerLink]="'/' + routes.PREDICTION_INFO"
                  (click)="mobileMenuOpen = false"
                >
                  <i class="bi bi-graph-up"></i> Carbon Forecast
                </a>
                <a
                  class="dropdown-item"
                  [routerLink]="'/' + routes.EVENT_FOOTPRINT"
                  (click)="mobileMenuOpen = false"
                >
                  <i class="bi bi-calendar-event"></i> Event Carbon Calculator
                </a>
              </div>
            </div>
          </li>

          <!-- Assessment Tools -->
          <li class="nav-item dropdown">
            <a
              class="nav-link"
              (click)="toggleDropdown('assessment-tools', $event)"
              [class.active]="
                isRouteActivePartial([routes.PORTEUR, routes.ESG])
              "
            >
              <i class="bi bi-clipboard-data"></i> Assessment Tools
              <i
                class="bi bi-chevron-down"
                [ngClass]="{
                  'bi-chevron-up': isDropdownActive('assessment-tools')
                }"
              ></i>
            </a>
            <div
              class="dropdown-menu"
              [class.show]="isDropdownActive('assessment-tools')"
            >
              <div class="mobile-dropdown-wrapper">
                <a
                  class="dropdown-item"
                  [routerLink]="'/' + routes.PORTEUR"
                  (click)="mobileMenuOpen = false"
                >
                  <i class="bi bi-tree"></i> Carbon Offset Projects
                </a>
                <a
                  class="dropdown-item"
                  [routerLink]="'/' + routes.ESG"
                  (click)="mobileMenuOpen = false"
                >
                  <i class="bi bi-shield-check"></i> ESG Assessment
                </a>
              </div>
            </div>
          </li>

          <!-- Marketplace -->
          <li class="nav-item">
            <a
              class="nav-link"
              [routerLink]="'/' + routes.MARKETPLACE"
              [class.active]="isRouteActive(routes.MARKETPLACE)"
              (click)="mobileMenuOpen = false"
            >
              <i class="bi bi-bag"></i> Marketplace
            </a>
          </li>

          <!-- Knowledge Hub -->
          <li class="nav-item">
            <a
              class="nav-link"
              [routerLink]="'/' + routes.RESOURCES"
              [class.active]="isRouteActive(routes.RESOURCES)"
              (click)="mobileMenuOpen = false"
            >
              <i class="bi bi-journal-text"></i> Knowledge Hub
            </a>
          </li>
        </ul>

        <!-- Action Items -->
        <div class="navbar-actions">
          <!-- Cart -->
          <a
            class="nav-action"
            [routerLink]="'/' + routes.CHECKOUT"
            [class.active]="isRouteActive(routes.CHECKOUT)"
            (click)="mobileMenuOpen = false"
            aria-label="Cart"
          >
            <i class="bi bi-bag"></i>
          </a>

          <!-- User Menu -->
          <div class="nav-item dropdown user-dropdown">
            <a
              class="nav-action"
              (click)="toggleDropdown('user', $event)"
              aria-label="User menu"
            >
              <i class="bi bi-person"></i>
            </a>
            <div
              class="dropdown-menu dropdown-menu-right"
              [class.show]="isDropdownActive('user')"
            >
              <a
                class="dropdown-item"
                [routerLink]="'/' + routes.TRANSACTIONS"
                (click)="mobileMenuOpen = false"
              >
                <i class="bi bi-clock-history"></i> Transactions
              </a>
              <div class="dropdown-divider"></div>
              <button
                class="dropdown-item"
                (click)="logout(); mobileMenuOpen = false"
              >
                <i class="bi bi-box-arrow-right"></i> Logout
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Mobile Toggle Button -->
    <button
      class="mobile-toggle"
      [class.active]="mobileMenuOpen"
      (click)="toggleMobileMenu()"
      aria-label="Toggle navigation"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</nav>

<!-- Backdrop for mobile menu -->
<div
  class="mobile-backdrop"
  [class.show]="mobileMenuOpen"
  (click)="mobileMenuOpen = false"
></div>
